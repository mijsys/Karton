<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tło (opcjonalne, jeśli logo ma być na kolorowym tle) -->
  <rect width="200" height="200" fill="none" />

  <!-- Warstwy tektury (fold = zgięcie) -->
  <path d="M50 50 L150 50 L150 100 L50 100 Z" fill="#4a6fa5" />
  <path d="M50 100 L150 100 L150 150 L50 150 Z" fill="#6c757d" />
  <path d="M50 150 L150 150 L150 200 L50 200 Z" fill="#ff6b6b" />

  <!-- Symbol Wayland (abstrakcyjna strzałka/okrąg) -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#ffffff" stroke-width="8" />
  <path d="M85 85 L115 100 L85 115 Z" fill="#ffffff" />

  <!-- Nazwa "FoldOS" -->
  <text x="100" y="180" font-family="Inter, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#212529">
    FoldOS
  </text>
</svg>
